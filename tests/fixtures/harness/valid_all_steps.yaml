apiVersion: devspark.ai/v1
kind: HarnessSpec
name: all-supported-steps

scope:
  type: repo

defaults:
  adapter: noop
  mode: agent
  retry:
    maxAttempts: 2
    backoff: fixed

telemetry:
  emit_jsonl: true
  run_dir: .documentation/devspark/runs

steps:
  - id: specify
    name: Write Feature Specification
    type: agent_task
    prompt_file: prompts/specify.md
    inputs:
      - .documentation/memory/constitution.md
    outputs:
      - .documentation/specs/001-feature/spec.md
    validation:
      - id: spec-exists
        type: file.exists
        severity: error
        path: .documentation/specs/001-feature/spec.md
      - id: spec-has-rationale
        type: file.contains
        severity: warning
        path: .documentation/specs/001-feature/spec.md
        contains: "## Rationale Summary"
      - id: spec-pattern
        type: regex.match
        severity: warning
        path: .documentation/specs/001-feature/spec.md
        pattern: "#"
    retry:
      maxAttempts: 3
      backoff: exponential
      retryOn:
        - validation_fail
      requireHumanAfter: 2
      repairPrompt: prompts/specify-repair.md
    on_success: validate

  - id: validate
    name: Validate Generated Outputs
    type: validation
    validation:
      - id: lint-passes
        type: command.exit_code
        severity: error
        command: markdownlint-cli2 .documentation/specs/001-feature/spec.md
      - id: schema-check
        type: json.schema
        severity: error
        schema_file: .devspark/schemas/harness.schema.json
        target_file: sample.harness.yaml
      - id: repo-clean
        type: git.clean
        severity: warning
        path: .documentation/specs/001-feature/
      - id: always-ok
        type: always.pass
        severity: warning
    on_success: human-review

  - id: human-review
    name: Human Review Gate
    type: human_gate
    mode: manual
    adapter: manual
    prompt_file: prompts/review.md