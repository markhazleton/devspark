name: Lint
permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  push:
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on bash scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts/bash'
          severity: warning
          additional_files: '.github/workflows/scripts'
        env:
          # SC1091: ShellCheck cannot follow sourced files (e.g. `source ./lib.sh`)
          # because the referenced files may not be present in the scan context.
          # Suppress this warning to avoid false positives on dynamic includes.
          SHELLCHECK_OPTS: -e SC1091
