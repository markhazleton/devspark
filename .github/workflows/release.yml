name: Create Release

on:
  push:
    branches: [main]
    paths:
      - ".knowledge/**"
      - ".devspark/VERSION"
      - "CHANGELOG.md"
      - "README.md"
      - "quickstart/**"
      - "memory/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version (e.g., 1.4.6 or v1.4.6). If omitted, workflow auto-selects."
        required: false
        type: string

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get latest tag
        id: get_tag
        run: |
          chmod +x .github/workflows/scripts/get-next-version.sh
          .github/workflows/scripts/get-next-version.sh "${{ github.event.inputs.release_version || '' }}"
      - name: Skip if nothing to release
        if: steps.get_tag.outputs.skip_release == 'true'
        run: |
          echo "::notice::.devspark/VERSION is already tagged. No release needed for this push."
      - name: Validate release version matches .devspark/VERSION
        if: steps.get_tag.outputs.skip_release != 'true'
        run: |
          devspark_version=$(grep -oE '^[[:space:]]*version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' .devspark/VERSION | head -n1 | sed -E 's/.*version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$devspark_version" ]; then
            echo "Unable to read version from .devspark/VERSION"
            exit 1
          fi

          release_version="${{ steps.get_tag.outputs.new_version }}"
          release_version="${release_version#v}"

          if [ "$devspark_version" != "$release_version" ]; then
            echo "Version mismatch: .devspark/VERSION=$devspark_version release=$release_version"
            echo "Update .devspark/VERSION before creating a release."
            exit 1
          fi

          echo "Version parity check passed: $release_version"
      - name: Check if release already exists
        if: steps.get_tag.outputs.skip_release != 'true'
        id: check_release
        run: |
          chmod +x .github/workflows/scripts/check-release-exists.sh
          .github/workflows/scripts/check-release-exists.sh ${{ steps.get_tag.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release package variants
        if: steps.get_tag.outputs.skip_release != 'true' && (steps.check_release.outputs.exists == 'false' || github.event_name == 'workflow_dispatch')
        run: |
          chmod +x .github/workflows/scripts/create-release-packages.sh
          .github/workflows/scripts/create-release-packages.sh ${{ steps.get_tag.outputs.new_version }}
      - name: Generate release notes
        if: steps.get_tag.outputs.skip_release != 'true' && (steps.check_release.outputs.exists == 'false' || github.event_name == 'workflow_dispatch')
        id: release_notes
        run: |
          chmod +x .github/workflows/scripts/generate-release-notes.sh
          .github/workflows/scripts/generate-release-notes.sh ${{ steps.get_tag.outputs.new_version }} ${{ steps.get_tag.outputs.latest_tag }}
      - name: Create GitHub Release
        if: steps.get_tag.outputs.skip_release != 'true' && (steps.check_release.outputs.exists == 'false' || github.event_name == 'workflow_dispatch')
        run: |
          chmod +x .github/workflows/scripts/create-github-release.sh
          .github/workflows/scripts/create-github-release.sh ${{ steps.get_tag.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
