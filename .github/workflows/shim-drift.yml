name: skill-drift

on:
  pull_request:
    paths:
      - "templates/commands/**"
      - "templates/consumer-skills/**"
      - ".github/skills/**"
      - "eng/skills/**"
      - "scripts/powershell/generate-atomic-shims.ps1"
      - "scripts/bash/generate-atomic-shims.sh"
      - ".github/workflows/shim-drift.yml"
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and consumer skills are not stale
        shell: bash
        run: |
          chmod +x scripts/bash/generate-atomic-shims.sh
          scripts/bash/generate-atomic-shims.sh --check
