apiVersion: devspark.ai/v1
kind: HarnessSpec
name: disabled-test
scope:
  type: repo
defaults:
  adapter: noop
  retry:
    maxAttempts: 1
    backoff: none
    retryOn:
    - validation_fail
  mode: agent
steps:
- id: disabled-step
  name: ''
  type: validation
  inputs: []
  outputs: []
  validation:
  - id: this-fails
    type: file.exists
    severity: error
    path: C:\Users\markh\AppData\Local\Temp\tmp0tuoj79j\absolutely_missing_file_xyz.txt
    expected_exit: 0
    git_base_ref: origin/main
    path_patterns: []
    min_changed_count: 1
    pass_threshold: 3
    enabled: false
  - id: this-passes
    type: always.pass
    severity: warning
    expected_exit: 0
    git_base_ref: origin/main
    path_patterns: []
    min_changed_count: 1
    pass_threshold: 3
    enabled: true
telemetry:
  emit_jsonl: true
  run_dir: .documentation/devspark/runs
