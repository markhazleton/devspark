apiVersion: devspark.ai/v1
kind: HarnessSpec
name: sample-harness
scope:
  type: repo
defaults:
  adapter: noop
  retry:
    maxAttempts: 2
    backoff: fixed
    retryOn:
    - validation_fail
  mode: agent
steps:
- id: specify
  name: Write Feature Specification
  type: agent_task
  prompt_file: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\contracts\harness-spec-yaml.md
  inputs:
  - C:\GitHub\MarkHazleton\DevSpark\.documentation\memory\constitution.md
  - C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\spec.md
  outputs:
  - C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\spec.md
  validation:
  - id: spec-present
    type: file.exists
    severity: error
    path: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\spec.md
    expected_exit: 0
  - id: spec-has-rationale
    type: file.contains
    severity: warning
    path: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\spec.md
    contains: '## Rationale Summary'
    expected_exit: 0
  retry:
    maxAttempts: 3
    backoff: exponential
    retryOn:
    - validation_fail
    requireHumanAfter: 2
    repairPrompt: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\contracts\cli-commands.md
  on_success: validate
- id: validate
  name: Validate Outputs
  type: validation
  inputs: []
  outputs: []
  validation:
  - id: schema-file-exists
    type: file.exists
    severity: error
    path: C:\GitHub\MarkHazleton\DevSpark\.devspark\schemas\harness.schema.json
    expected_exit: 0
  - id: lint-contract
    type: command.exit_code
    severity: error
    command: markdownlint-cli2 .documentation/specs/002-harness-runtime/spec.md
    expected_exit: 0
  - id: schema-shape
    type: json.schema
    severity: warning
    expected_exit: 0
    schema_file: C:\GitHub\MarkHazleton\DevSpark\.devspark\schemas\harness.schema.json
    target_file: C:\GitHub\MarkHazleton\DevSpark\sample.harness.yaml
  - id: repo-clean
    type: git.clean
    severity: warning
    path: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime
    expected_exit: 0
  - id: spec-heading
    type: regex.match
    severity: warning
    path: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\spec.md
    expected_exit: 0
    pattern: Feature Specification
  - id: wiring-ok
    type: always.pass
    severity: warning
    expected_exit: 0
  on_success: human-review
- id: human-review
  name: Human Review Gate
  type: human_gate
  mode: manual
  adapter: manual
  prompt_file: C:\GitHub\MarkHazleton\DevSpark\.documentation\specs\002-harness-runtime\contracts\cli-commands.md
  inputs: []
  outputs: []
  validation: []
telemetry:
  emit_jsonl: true
  run_dir: C:\GitHub\MarkHazleton\DevSpark\.documentation\devspark\runs
