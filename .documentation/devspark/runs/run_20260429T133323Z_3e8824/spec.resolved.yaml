apiVersion: devspark.ai/v1
kind: HarnessSpec
name: plan-test
scope:
  type: repo
defaults:
  adapter: noop
  retry:
    maxAttempts: 1
    backoff: none
    retryOn:
    - validation_fail
  mode: agent
steps:
- id: plan-step
  name: ''
  type: validation
  inputs: []
  outputs: []
  validation:
  - id: cmd-check
    type: command.exit_code
    severity: error
    command: git --version
    expected_exit: 0
    git_base_ref: origin/main
    path_patterns: []
    min_changed_count: 1
    pass_threshold: 3
    enabled: true
  - id: always-ok
    type: always.pass
    severity: warning
    expected_exit: 0
    git_base_ref: origin/main
    path_patterns: []
    min_changed_count: 1
    pass_threshold: 3
    enabled: true
telemetry:
  emit_jsonl: true
  run_dir: .documentation/devspark/runs
