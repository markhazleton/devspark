apiVersion: devspark.ai/v1
kind: HarnessSpec
name: delivery-contract
scope:
  type: repo
defaults:
  adapter: noop
  retry:
    maxAttempts: 1
    backoff: none
    retryOn:
    - validation_fail
  mode: agent
steps:
- id: implement
  name: ''
  type: agent_task
  prompt_file: /private/var/folders/rb/0ghx2wjs79j4zyb6f064k2tc0000gn/T/pytest-of-markhazleton/pytest-2/test_delivery_status_met_with_0/prompts/base.md
  inputs: []
  outputs: []
  validation:
  - id: always
    type: always.pass
    severity: warning
    expected_exit: 0
    git_base_ref: origin/main
    path_patterns: []
    min_changed_count: 1
    pass_threshold: 3
    enabled: true
telemetry:
  emit_jsonl: true
  run_dir: .documentation/devspark/runs
